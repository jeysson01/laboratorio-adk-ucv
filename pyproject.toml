[project]
name = "laboratorio-adk-ucv"
version = "0.1.0"
description = "Agente académico UCV con Google ADK"
authors = [
    {name = "Jeysson Ayala",email = "jeysson017@gmail.com"}
]
packages = [{include = "agente_ucv"}]
requires-python = ">=3.11"
dependencies = [
    "google-adk (>=2.1.0,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)"
]